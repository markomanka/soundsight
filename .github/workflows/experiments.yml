name: Experiments

# Re-runs pre-registered experiments so that published numbers are never stale.
# Weekly, on demand, and whenever code they depend on changes.
on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/soundsight/acoustics/**"
      - "tools/experiments/**"
      - "src/soundsight/acoustics/candidates/**"
      - "docs/experiments/EXP-0003-*"
      - "docs/experiments/EXP-0004-*"
      - "docs/experiments/EXP-0005-*"
      - "src/soundsight/exercise/**"
      - "docs/quality/budgets.toml"
  push:
    branches: [main]
    paths:
      - "src/soundsight/acoustics/**"
      - "tools/experiments/**"
      - "src/soundsight/acoustics/candidates/**"
      - "docs/experiments/EXP-0003-*"
      - "docs/experiments/EXP-0004-*"
      - "docs/experiments/EXP-0005-*"
      - "src/soundsight/exercise/**"
      - "docs/quality/budgets.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.7"

jobs:
  exp0003:
    name: EXP-0003 size-discrimination discs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - name: Re-run and compare with the stored results
        run: uv run --no-sync python tools/experiments/exp0003.py --check

  exp0004:
    name: EXP-0004 reference validity and baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - name: Recompute the references, check their validity, compare with the stored file
        run: uv run --no-sync python tools/experiments/exp0004.py --check
      - name: Re-evaluate candidate C1 and report its cost on this runner (W4)
        run: uv run --no-sync python tools/experiments/exp0004.py --candidate c1 --check
      - name: Re-evaluate candidate C2 and report its cost on this runner (W4)
        run: uv run --no-sync python tools/experiments/exp0004.py --candidate c2 --check

  exp0005:
    name: EXP-0005 exercise rendering (R1 in full, R2 sample, official cost)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - name: Download and verify the 2016 recording
        run: uv run --no-sync python tools/fetch_legacy_click.py
      - name: Recompute and compare with the stored results
        run: uv run --no-sync python tools/experiments/exp0005.py check
      - name: Measure M3 on this runner (official figures, shown as notices)
        run: uv run --no-sync python tools/experiments/exp0005.py cost
