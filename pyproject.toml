[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soundsight"
version = "0.1.0.dev0"
description = "Open toolkit for training human echolocation: click analysis and virtual echo-acoustic exercises."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "The SoundSight contributors" }]
keywords = ["echolocation", "acoustics", "accessibility", "blindness", "audio", "binaural"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.2",
]

[project.scripts]
soundsight = "soundsight.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
lint = [
    "ruff>=0.8",
    "mypy>=1.11",
    "scipy-stubs>=1.14.1",
    "reuse>=5.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "LICENSES", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "REUSE.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/soundsight"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not slow"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "legacy: needs the 2016 click recording (fetch it with tools/fetch_legacy_click.py)",
    "slow: fine-grid acoustic validation, run by a dedicated CI job (pytest -m slow)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["soundsight"]
# __main__.py is exercised through a subprocess in tests/test_cli.py, which coverage cannot see.
omit = ["*/soundsight/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "D", "NPY", "PT", "SIM", "RUF",
    "C4", "PIE", "RET", "ARG", "PTH", "PL", "S", "T20", "ERA",
]
ignore = [
    "PLR0913",  # numerical APIs legitimately take many keyword arguments
    "S603",     # subprocess calls in tools/ use fixed argument lists, never a shell
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "PLR0915"]
"tools/**" = ["T201"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "tools"]
# Name modules by path from these roots, so tests/conftest.py and
# tests/acoustics/conftest.py are distinct modules.
mypy_path = ["src", "."]
explicit_package_bases = true
