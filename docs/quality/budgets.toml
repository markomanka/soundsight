# Thresholds that tests and CI enforce: one source of truth, versioned with the code.
#
# "No benchmark without a budget": a number means something only against a threshold
# fixed before the measurement (docs/experiments/README.md). Each value says whether it
# was pre-registered or set retrospectively, and which experiment it belongs to.
# (File proposed by Kimi, kimi.ai, in the 2026-11-15 quality-gates draft.)

[acoustics.conformance]
# Echo level over the click band, model against reference. About 1 dB is the smallest
# level difference listeners notice. Fixed before measuring (EXP-0002, EXP-0003).
level_tolerance_db = 1.0

# Difference in echo level between two object sizes. Retrospective in EXP-0002;
# pre-registered at this value for EXP-0003.
size_cue_tolerance_db = 1.5

# Mean complex error of the echo spectrum for a large disk (ka above 5).
# Retrospective (EXP-0002): chosen to hold measured behaviour against regression.
large_disk_spectrum_error = 0.08

# Mean complex error of the echo spectrum for a small disk (ka below 0.5).
# Retrospective (EXP-0002).
compact_disk_spectrum_error = 0.05

[acoustics.click_band_hz]
# Where clicks carry most of their energy (literature B1). Fixed before measuring.
low = 2000.0
high = 4000.0

[experiments]
# A re-run of an experiment must reproduce its stored levels to this precision. A
# numerical tolerance (platform and library differences), not a perceptual one.
reproducibility_db = 0.02

[experiments.exp0004]
# Pre-registered 2026-11-17, before any higher-order diffraction candidate exists.
# Echo level in each ka band of workload W2, candidate against wave solver.
band_level_db = 1.0
# Mean complex error of the echo spectrum in each band of W2.
spectrum_error = 0.10
# Validity of the reference itself: the two runs must agree in their overlap band, and
# at the lowest frequency the reference must approach the exact small-disk limit.
reference_overlap_db = 0.3
reference_compact_limit = 0.03
# Cost on a standard GitHub ubuntu-24.04 runner, median of three runs, 25.4 cm disc at
# 33 cm: frequency response at 20 frequencies in 2 to 4 kHz, and a full 48 kHz impulse
# response. Chosen so that an exercise pack of about 200 echoes precomputes overnight on
# modest hardware (200 x 120 s is under 7 hours).
cost_frequency_response_s = 10.0
cost_impulse_response_s = 120.0

[experiments.exp0005]
# Pre-registered 2026-11-18. Click-weighted spectral error of a trial's echo against C2.
weighted_error_db = -25.0
# Echo level from 2 to 4 kHz against C2, as in EXP-0003.
band_level_db = 1.0
# Median of three renders of the costliest trial on a standard GitHub runner.
cost_trial_s = 120.0

[experiments.exp0006]
# Pre-registered 2026-11-27. Accuracy gates are EXP-0005's, unchanged.
weighted_error_db = -25.0
band_level_db = 1.0
# M3a: rendering one trial from a disc's cache (median of three, costliest combination).
cost_trial_s = 1.0
# M3b: building the cache of the costliest disc (25.4 cm at 33 cm), one run. Eighteen
# discs then take at most six hours: an exercise pack precomputes overnight.
cost_cache_s = 1200.0
